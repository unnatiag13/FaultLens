
services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - backend

  
  
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r /app/dependencies.txt && python /app/demo_backend.py"
    ports:
      - "8001:8001"
    volumes:
      - ./demo_backend.py:/app/demo_backend.py:ro
      - ./backend/requirements.txt:/app/dependencies.txt:ro

    environment:
      DB_HOST: database
      POSTGRES_DB: faultlens_demo
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
    depends_on:
      - database



  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: faultlens_demo
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password